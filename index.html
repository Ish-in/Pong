<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-contain">
        <div class="score-board">
            <div id="LeftScore">0</div>
            <div id="RightScore">0</div>
        </div>


    <div class="ball" id="ball"></div>
    <div class="paddle left-paddle" id="LeftPaddle"></div>
    <div class="paddle right-paddle" id="RightPaddle"></div>
    <div class="winner-message" id="winnerMessage"></div>
</div>

<button id="restartButton">Restart</button>

<script src="script.js"></script>


</body>
</html>
